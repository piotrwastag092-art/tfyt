<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UCIEKAJ PRZED PARAGONEM</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #171717;
        color: white;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    #game {
        width: 420px;
        max-width: 95vw;
        height: 700px;
        max-height: 95vh;
        background: linear-gradient(#75c9ff, #dff7ff);
        border: 6px solid white;
        border-radius: 20px;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(255,255,255,.15);
    }

    #hud {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        padding: 12px;
        display: flex;
        justify-content: space-between;
        font-size: 18px;
        font-weight: bold;
        background: rgba(0,0,0,.25);
        z-index: 10;
    }

    #player {
        position: absolute;
        bottom: 25px;
        left: 180px;
        font-size: 55px;
        width: 60px;
        height: 60px;
        text-align: center;
        z-index: 5;
        user-select: none;
    }

    .item {
        position: absolute;
        font-size: 42px;
        width: 50px;
        height: 50px;
        text-align: center;
        user-select: none;
    }

    #startScreen {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,.82);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 25px;
        z-index: 100;
    }

    #startScreen h1 {
        font-size: 38px;
        margin: 0 0 10px;
        transform: rotate(-2deg);
    }

    #startScreen p {
        font-size: 18px;
        line-height: 1.5;
    }

    button {
        margin-top: 20px;
        border: none;
        border-radius: 14px;
        padding: 16px 25px;
        font-size: 20px;
        font-weight: bold;
        cursor: pointer;
        background: #ffe600;
        color: #111;
        box-shadow: 0 5px 0 #b6a400;
    }

    button:active {
        transform: translateY(4px);
        box-shadow: 0 1px 0 #b6a400;
    }

    #message {
        position: absolute;
        top: 45%;
        width: 100%;
        text-align: center;
        font-size: 30px;
        font-weight: bold;
        text-shadow: 3px 3px 0 black;
        pointer-events: none;
        z-index: 50;
    }

    .hidden {
        display: none !important;
    }

    .shake {
        animation: shake .2s;
    }

    @keyframes shake {
        0% { transform: translateX(0); }
        25% { transform: translateX(-10px); }
        50% { transform: translateX(10px); }
        75% { transform: translateX(-10px); }
        100% { transform: translateX(0); }
    }

    #instructions {
        position: absolute;
        bottom: 5px;
        width: 100%;
        text-align: center;
        font-size: 12px;
        color: rgba(0,0,0,.5);
    }
</style>
</head>

<body>

<div id="game">

    <div id="hud">
        <div>🥔 Ziemniak: <span id="score">0</span></div>
        <div>❤️ <span id="lives">3</span></div>
    </div>

    <div id="player">🥔</div>

    <div id="message"></div>

    <div id="instructions">
        ← → / A D — uciekaj
    </div>

    <div id="startScreen">

        <h1>🥔 UCIEKAJ PRZED PARAGONEM</h1>

        <p>
            Jesteś zwykłym ziemniakiem.<br><br>
            Zbieraj <b>💸 🍺 🧀</b><br>
            Unikaj <b>🧾 👨‍💼</b><br><br>
            Nie pytaj dlaczego.
        </p>

        <button id="startButton">ROZPOCZNIJ CHAOS</button>

    </div>

</div>

<script>

const game = document.getElementById("game");
const player = document.getElementById("player");
const scoreElement = document.getElementById("score");
const livesElement = document.getElementById("lives");
const startScreen = document.getElementById("startScreen");
const startButton = document.getElementById("startButton");
const message = document.getElementById("message");

let playerX = 180;
let score = 0;
let lives = 3;
let running = false;

let keys = {
    left: false,
    right: false
};

let objects = [];

let spawnTimer = null;
let gameTimer = null;

const goodItems = ["💸", "🍺", "🧀", "🍕", "🥤"];
const badItems = ["🧾", "👨‍💼", "📄", "💀", "🏦"];


// -------------------------
// START
// -------------------------

startButton.addEventListener("click", startGame);


function startGame() {

    startScreen.classList.add("hidden");

    score = 0;
    lives = 3;
    playerX = 180;

    scoreElement.textContent = score;
    livesElement.textContent = lives;

    player.style.left = playerX + "px";

    clearObjects();

    running = true;

    message.textContent = "";

    startSpawning();
    gameLoop();
}


// -------------------------
// STEROWANIE
// -------------------------

document.addEventListener("keydown", function(e) {

    if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") {
        keys.left = true;
    }

    if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") {
        keys.right = true;
    }

});


document.addEventListener("keyup", function(e) {

    if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") {
        keys.left = false;
    }

    if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") {
        keys.right = false;
    }

});


// -------------------------
// SPAWN
// -------------------------

function startSpawning() {

    clearInterval(spawnTimer);

    spawnTimer = setInterval(function() {

        if (!running) return;

        spawnObject();

    }, 650);
}


function spawnObject() {

    const element = document.createElement("div");

    element.className = "item";

    const isGood = Math.random() < 0.6;

    if (isGood) {
        element.textContent =
            goodItems[Math.floor(Math.random() * goodItems.length)];
    } else {
        element.textContent =
            badItems[Math.floor(Math.random() * badItems.length)];
    }

    const x = Math.random() * 350;

    element.style.left = x + "px";
    element.style.top = "-60px";

    game.appendChild(element);

    objects.push({
        element: element,
        x: x,
        y: -60,
        speed: 3 + Math.random() * 3,
        good: isGood
    });
}


// -------------------------
// GAME LOOP
// -------------------------

function gameLoop() {

    if (!running) return;

    movePlayer();
    moveObjects();
    checkCollisions();

    requestAnimationFrame(gameLoop);
}


// -------------------------
// GRACZ
// -------------------------

function movePlayer() {

    if (keys.left) {
        playerX -= 7;
    }

    if (keys.right) {
        playerX += 7;
    }

    if (playerX < 0) {
        playerX = 0;
    }

    if (playerX > 350) {
        playerX = 350;
    }

    player.style.left = playerX + "px";
}


// -------------------------
// OBIEKTY
// -------------------------

function moveObjects() {

    for (let i = objects.length - 1; i >= 0; i--) {

        const obj = objects[i];

        obj.y += obj.speed;

        obj.element.style.top = obj.y + "px";

        if (obj.y > 720) {

            obj.element.remove();

            objects.splice(i, 1);

            continue;
        }
    }
}


// -------------------------
// KOLIZJE
// -------------------------

function checkCollisions() {

    const playerRect = player.getBoundingClientRect();

    for (let i = objects.length - 1; i >= 0; i--) {

        const obj = objects[i];

        const rect = obj.element.getBoundingClientRect();

        if (isColliding(playerRect, rect)) {

            if (obj.good) {

                collectGood();

            } else {

                hitBad();

            }

            obj.element.remove();

            objects.splice(i, 1);
        }
    }
}


function isColliding(a, b) {

    return !(
        a.right < b.left ||
        a.left > b.right ||
        a.bottom < b.top ||
        a.top > b.bottom
    );
}


// -------------------------
// DOBRE
// -------------------------

function collectGood() {

    score++;

    scoreElement.textContent = score;

    message.textContent = "+1 🤑";

    setTimeout(function() {

        if (running) {
            message.textContent = "";
        }

    }, 300);

}


// -------------------------
// ZŁE
// -------------------------

function hitBad() {

    lives--;

    livesElement.textContent = lives;

    game.classList.remove("shake");

    void game.offsetWidth;

    game.classList.add("shake");

    message.textContent = "PARAGON CIĘ DOPADŁ 😭";

    setTimeout(function() {

        if (running) {
            message.textContent = "";
        }

    }, 600);

    if (lives <= 0) {

        endGame();

    }
}


// -------------------------
// KONIEC
// -------------------------

function endGame() {

    running = false;

    clearInterval(spawnTimer);

    message.textContent = "";

    startScreen.classList.remove("hidden");

    startScreen.querySelector("h1").textContent =
        "💀 ZIEMNIAK ZBANKRUTOWAŁ";

    startScreen.querySelector("p").innerHTML =
        "Twój wynik: <b>" + score + "</b><br><br>" +
        "Państwo wygrało.";

    startButton.textContent = "SPRÓBUJ JESZCZE RAZ";
}


// -------------------------
// CZYSZCZENIE
// -------------------------

function clearObjects() {

    objects.forEach(function(obj) {

        obj.element.remove();

    });

    objects = [];
}

</script>

</body>
</html>
