<!doctype html>

<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🦆 Kaczka kontra Kapitalizm</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at 50% 15%, #293b70, #080c18 70%);
  color: white;
  font-family: system-ui, sans-serif;
  display: grid;
  place-items: center;
  overflow: hidden;
}

.wrap {
  width: min(960px, 96vw);
}

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}

h1 {
  margin: 0;
  font-size: clamp(20px, 4vw, 36px);
}

.hud {
  display: flex;
  gap: 8px;
}

.pill {
  padding: 8px 12px;
  border-radius: 999px;
  background: #141c32;
  border: 1px solid #405075;
  font-weight: 800;
}

canvas {
  width: 100%;
  display: block;
  border-radius: 18px;
  border: 2px solid #536993;
  background: #10182b;
  box-shadow: 0 20px 70px #0009;
}

.help {
  text-align: center;
  opacity: .75;
  margin-top: 10px;
  font-size: 14px;
}

.overlay {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  background: #02040dcc;
  backdrop-filter: blur(6px);
}

.card {
  width: min(520px, 90vw);
  padding: 30px;
  text-align: center;
  border-radius: 24px;
  background: #11182d;
  border: 1px solid #536993;
  box-shadow: 0 25px 100px #000b;
}

.card h2 {
  font-size: 30px;
  margin-top: 0;
}

.card p {
  line-height: 1.6;
  opacity: .9;
}

button {
  border: 0;
  border-radius: 15px;
  padding: 15px 25px;
  font-size: 18px;
  font-weight: 900;
  cursor: pointer;
  background: #ffe66d;
  color: #17130a;
  box-shadow: 0 8px 0 #b59b27;
  transition: transform .08s, box-shadow .08s;
}

button:hover {
  transform: translateY(-2px);
}

button:active {
  transform: translateY(5px);
  box-shadow: 0 3px 0 #b59b27;
}

.hidden {
  display: none !important;
}
</style>

</head>

<body>

<div class="wrap">

  <div class="top">

```
<h1>🦆 KACZKA KONTRA KAPITALIZM</h1>

<div class="hud">
  <div class="pill">💸 <span id="score">0</span></div>
  <div class="pill">❤️ <span id="hp">3</span></div>
  <div class="pill">⏱️ <span id="time">0</span></div>
</div>
```

  </div>

<canvas id="game" width="960" height="540"></canvas>

  <div class="help">
    WASD / strzałki — ruch · Z — turbo · Space — pauza
  </div>

</div>

<div class="overlay" id="overlay">

  <div class="card">

```
<h2 id="title">🦆 Państwo kontra Kaczka</h2>

<p id="message">
  System wykrył zbyt wysoką produktywność.
  Zbieraj pieniądze i uciekaj przed kontrolą skarbową.
</p>

<button id="startButton" type="button">
  ODPAL KACZKĘ 🦆
</button>
```

  </div>

</div>

<script>

"use strict";


/* =========================
   ELEMENTY
========================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const overlay = document.getElementById("overlay");
const startButton = document.getElementById("startButton");

const title = document.getElementById("title");
const message = document.getElementById("message");

const scoreElement = document.getElementById("score");
const hpElement = document.getElementById("hp");
const timeElement = document.getElementById("time");

const WIDTH = canvas.width;
const HEIGHT = canvas.height;


/* =========================
   STAN GRY
========================= */

let gameRunning = false;
let gamePaused = false;

let lastTime = 0;

let score = 0;
let hp = 3;
let elapsed = 0;

let turbo = 0;
let spawnTimer = 0;
let screenShake = 0;

const keys = {};

let duck;

let money = [];
let taxPapers = [];
let particles = [];


/* =========================
   KLAWIATURA
========================= */

window.addEventListener("keydown", function(event) {

  keys[event.key.toLowerCase()] = true;

  if (event.code === "Space") {

    event.preventDefault();

    if (gameRunning) {
      gamePaused = !gamePaused;
    }

  }

});


window.addEventListener("keyup", function(event) {

  keys[event.key.toLowerCase()] = false;

});


/* =========================
   POMOCNICZE
========================= */

function random(min, max) {
  return min + Math.random() * (max - min);
}


function distance(a, b) {
  return Math.hypot(
    a.x - b.x,
    a.y - b.y
  );
}


function updateHUD() {

  scoreElement.textContent = score;
  hpElement.textContent = hp;
  timeElement.textContent = Math.floor(elapsed);

}


/* =========================
   OBIEKTY
========================= */

function createMoney() {

  money.push({
    x: random(40, WIDTH - 40),
    y: random(70, HEIGHT - 40),
    radius: 15,
    rotation: random(0, Math.PI * 2)
  });

}


function createTaxPaper() {

  const side = Math.floor(random(0, 4));

  const paper = {
    x: 0,
    y: 0,
    vx: 0,
    vy: 0,
    radius: 22
  };


  if (side === 0) {

    paper.x = random(0, WIDTH);
    paper.y = -40;
    paper.vy = random(70, 120);

  }

  else if (side === 1) {

    paper.x = random(0, WIDTH);
    paper.y = HEIGHT + 40;
    paper.vy = -random(70, 120);

  }

  else if (side === 2) {

    paper.x = -40;
    paper.y = random(0, HEIGHT);
    paper.vx = random(70, 120);

  }

  else {

    paper.x = WIDTH + 40;
    paper.y = random(0, HEIGHT);
    paper.vx = -random(70, 120);

  }


  taxPapers.push(paper);

}


function createParticles(x, y, amount) {

  for (let i = 0; i < amount; i++) {

    particles.push({
      x: x,
      y: y,
      vx: random(-150, 150),
      vy: random(-150, 150),
      life: random(.3, .8),
      size: random(2, 6)
    });

  }

}


/* =========================
   RESET
========================= */

function resetGame() {

  score = 0;
  hp = 3;
  elapsed = 0;

  turbo = 0;
  spawnTimer = 0;
  screenShake = 0;

  gamePaused = false;

  duck = {
    x: WIDTH / 2,
    y: HEIGHT / 2,
    vx: 0,
    vy: 0,
    radius: 25
  };

  money = [];
  taxPapers = [];
  particles = [];


  for (let i = 0; i < 8; i++) {
    createMoney();
  }


  for (let i = 0; i < 2; i++) {
    createTaxPaper();
  }


  updateHUD();

}


/* =========================
   START GRY
========================= */

function startGame() {

  console.log("Kaczka startuje!");

  resetGame();

  gameRunning = true;

  overlay.classList.add("hidden");

  startButton.blur();

  lastTime = performance.now();

  requestAnimationFrame(gameLoop);

}


/* =========================
   KONIEC
========================= */

function gameOver() {

  gameRunning = false;

  title.textContent =
    "🦆 Kaczka została zoptymalizowana";

  message.textContent =
    "Wynik: " +
    score +
    " 💸 | Czas: " +
    Math.floor(elapsed) +
    " sekund. " +
    "Korporacja jest dumna. Niestety z ciebie nie.";

  startButton.textContent =
    "JESZCZE RAZ 🦆";

  overlay.classList.remove("hidden");

}


/* =========================
   PRZYCISK START
========================= */

startButton.addEventListener("click", function(event) {

  event.preventDefault();

  startGame();

});


/* =========================
   PĘTLA GRY
========================= */

function gameLoop(currentTime) {

  if (!gameRunning) {
    return;
  }


  const delta =
    Math.min(
      0.033,
      (currentTime - lastTime) / 1000
    );


  lastTime = currentTime;


  if (!gamePaused) {

    update(delta);

  }


  draw();


  requestAnimationFrame(gameLoop);

}


/* =========================
   UPDATE
========================= */

function update(delta) {

  elapsed += delta;

  spawnTimer += delta;


  /*
    Im dłużej żyjesz,
    tym szybciej państwo produkuje papier.
  */

  const spawnDelay =
    Math.max(
      .3,
      1.2 - elapsed * .01
    );


  if (spawnTimer >= spawnDelay) {

    spawnTimer = 0;

    createMoney();

    if (Math.random() < .7) {
      createTaxPaper();
    }

  }


  /* Ruch */

  let horizontal = 0;
  let vertical = 0;


  if (
    keys["d"] ||
    keys["arrowright"]
  ) {
    horizontal++;
  }


  if (
    keys["a"] ||
    keys["arrowleft"]
  ) {
    horizontal--;
  }


  if (
    keys["s"] ||
    keys["arrowdown"]
  ) {
    vertical++;
  }


  if (
    keys["w"] ||
    keys["arrowup"]
  ) {
    vertical--;
  }


  /* Turbo */

  if (
    keys["z"] &&
    turbo <= 0
  ) {

    turbo = 2;

  }


  if (turbo > 0) {
    turbo -= delta;
  }


  const speed =
    turbo > 0
      ? 560
      : 230;


  const vectorLength =
    Math.hypot(
      horizontal,
      vertical
    ) || 1;


  duck.vx =
    horizontal / vectorLength * speed;

  duck.vy =
    vertical / vectorLength * speed;


  duck.x += duck.vx * delta;
  duck.y += duck.vy * delta;


  /* Granice */

  duck.x =
    Math.max(
      duck.radius,
      Math.min(
        WIDTH - duck.radius,
        duck.x
      )
    );


  duck.y =
    Math.max(
      55,
      Math.min(
        HEIGHT - duck.radius,
        duck.y
      )
    );


  /* Pieniądze */

  for (
    let i = money.length - 1;
    i >= 0;
    i--
  ) {

    const coin = money[i];

    coin.rotation += delta * 5;


    if (
      distance(duck, coin) <
      duck.radius + coin.radius
    ) {

      score += 10;

      createParticles(
        coin.x,
        coin.y,
        12
      );

      money.splice(i, 1);

    }

  }


  /* Urząd Skarbowy */

  for (
    let i = taxPapers.length - 1;
    i >= 0;
    i--
  ) {

    const paper = taxPapers[i];

    paper.x += paper.vx * delta;
    paper.y += paper.vy * delta;


    if (
      distance(duck, paper) <
      duck.radius + paper.radius
    ) {

      hp--;

      screenShake = .3;

      createParticles(
        duck.x,
        duck.y,
        20
      );

      taxPapers.splice(i, 1);


      if (hp <= 0) {

        updateHUD();

        gameOver();

        return;

      }

    }


    if (
      paper.x < -80 ||
      paper.x > WIDTH + 80 ||
      paper.y < -80 ||
      paper.y > HEIGHT + 80
    ) {

      taxPapers.splice(i, 1);

    }

  }


  /* Cząsteczki */

  for (
    let i = particles.length - 1;
    i >= 0;
    i--
  ) {

    const particle = particles[i];

    particle.x += particle.vx * delta;
    particle.y += particle.vy * delta;

    particle.life -= delta;


    if (particle.life <= 0) {

      particles.splice(i, 1);

    }

  }


  screenShake =
    Math.max(
      0,
      screenShake - delta
    );


  updateHUD();

}


/* =========================
   RYSOWANIE
========================= */

function draw() {

  ctx.save();


  if (screenShake > 0) {

    ctx.translate(
      random(-6, 6),
      random(-6, 6)
    );

  }


  /* Tło */

  const background =
    ctx.createLinearGradient(
      0,
      0,
      0,
      HEIGHT
    );

  background.addColorStop(
    0,
    "#172443"
  );

  background.addColorStop(
    1,
    "#0b1224"
  );


  ctx.fillStyle = background;

  ctx.fillRect(
    0,
    0,
    WIDTH,
    HEIGHT
  );


  /* Linie */

  ctx.globalAlpha = .12;

  ctx.strokeStyle = "#a8bbff";

  for (let i = 0; i < 20; i++) {

    ctx.beginPath();

    ctx.moveTo(
      i * 60,
      0
    );

    ctx.lineTo(
      i * 60 - 200,
      HEIGHT
    );

    ctx.stroke();

  }

  ctx.globalAlpha = 1;


  /* Pieniądze */

  money.forEach(coin => {

    ctx.save();

    ctx.translate(
      coin.x,
      coin.y
    );

    ctx.rotate(
      coin.rotation
    );

    ctx.font = "28px serif";

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
      "💰",
      0,
      0
    );

    ctx.restore();

  });


  /* Dokumenty */

  taxPapers.forEach(paper => {

    ctx.save();

    ctx.translate(
      paper.x,
      paper.y
    );

    ctx.rotate(
      Math.atan2(
        paper.vy,
        paper.vx
      )
    );

    ctx.font = "36px serif";

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
      "📑",
      0,
      0
    );

    ctx.restore();

  });


  /* Cząsteczki */

  particles.forEach(particle => {

    ctx.globalAlpha =
      Math.max(
        0,
        particle.life
      );

    ctx.fillStyle =
      "#ffe66d";

    ctx.fillRect(
      particle.x,
      particle.y,
      particle.size,
      particle.size
    );

  });


  ctx.globalAlpha = 1;


  /* Kaczka */

  ctx.save();

  ctx.translate(
    duck.x,
    duck.y
  );


  const tilt =
    duck.vx * .0007;


  ctx.rotate(tilt);


  ctx.font = "54px serif";

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";


  ctx.fillText(
    turbo > 0
      ? "🦆💨"
      : "🦆",
    0,
    0
  );


  ctx.restore();


  /* Pauza */

  if (gamePaused) {

    ctx.fillStyle = "#fff";

    ctx.font =
      "900 24px system-ui";

    ctx.textAlign = "center";

    ctx.fillText(
      "⏸ PAUZA",
      WIDTH / 2,
      45
    );

  }


  ctx.restore();

}


/* =========================
   PIERWSZE RYSOWANIE
========================= */

resetGame();

draw();

</script>

</body>
</html>
